[GENERAL]
# Data pas default
datasets_a_charger = Tesla,Ferrari,BMW,Toyota

[Tesla]
chemin = ./data/tesla_stock_data_2010_2025.csv
features = Open, High, Low, Volume, MA_7, Volatility_7d
target = Price_Range

[Ferrari]
chemin = ./data/Ferrari_Stock_Data.csv
features = Open, High, Low, Volume
target = Price_Range

[BMW]
chemin = ./data/BMW_Stock_Data.csv
features = Open, High, Low, Volume, Adj_Close
target = Price_Range

[Toyota]
chemin = ./data/Toyota_Stock_1980_2025.csv
features = Open, High, Low, Volume,Adj_Close
target = Price_Range