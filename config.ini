[GENERAL]
# Liste des marques séparées par des virgules (sans espaces après les virgules)
datasets_a_charger = Tesla,BMW,Lambo,Toyota

[Tesla]
chemin = ./data/tesla_stock_data_2010_2025.csv
features = Open,High,Low,Volume,MA_7,Volatility_7d
target = Price_Range

[BMW]
# Attention : Assure-toi que ces fichiers existent dans ton dossier ./data/
chemin = ./data/BMW_Stock_Data.csv
features = Open,High,Low,Volume
target = Close

[Lambo]
chemin = ./data/lamborghini_stock_data.csv
features = Open,High,Low,Volume
target = Close

[Toyota]
chemin = ./data/Toyota_Stock_1980_2025.csv
features = Open,High,Low,Volume
target = Close