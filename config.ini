[GENERAL]
# Data pas default
datasets_a_charger = Tesla,Ferrari,BMW,Toyota
#, Netflix, Bitcoin
slider_open_min = 0.5
slider_open_max = 3.0
slider_volume_min = 0.1
slider_volume_max = 5.0

[Tesla]
chemin = ./data/tesla_stock_data_2010_2025.csv
features = Open, High, Low, Volume, MA_7, Volatility_7d
target = Price_Range
couleur = #ba1c21
logo = https://upload.wikimedia.org/wikipedia/commons/e/e8/Tesla_logo.png
description = Marque pionnière en voiture électrique

[Ferrari]
chemin = ./data/Ferrari_Stock_Data.csv
features = Open, High, Low, Volume
target = Price_Range
couleur = #dada54
logo = https://upload.wikimedia.org/wikipedia/commons/3/3a/Deus_Ferrari.png
description = Constructeur de voiture luxueuse

[BMW]
chemin = ./data/BMW_Stock_Data.csv
features = Open, High, Low, Volume, Adj_Close
target = Price_Range
couleur = #115d93
logo = https://upload.wikimedia.org/wikipedia/commons/4/44/BMW.svg
description = Constructeur premium allemand réputé

[Toyota]
chemin = ./data/Toyota_Stock_1980_2025.csv
features = Open, High, Low, Volume,Adj_Close
target = Price_Range
couleur = #a81aa8
logo = https://upload.wikimedia.org/wikipedia/commons/e/ee/Toyota_logo_%28Red%29.svg
description = "Leader de l'hybride mondiale"

